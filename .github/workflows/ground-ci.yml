name: Ground CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Audit published curriculum
        run: npm run audit:content

  browser-auth-tests:
    name: Browser auth and cloud sync tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run account and sync scenarios
        run: python -u tests/browser_cloud.py -v

  browser-mobile-tests:
    name: Browser mobile and lesson tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run lesson and mobile scenarios
        run: python -u tests/browser_smoke.py -v
      - name: Run offline lessons and olympiad scenarios
        run: python -u tests/browser_offline.py -v


  firebase-emulator-tests:
    name: Firebase Auth and Firestore rules integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test real Firebase emulators and Firestore rules
        run: npm run test:firebase
      - name: Verify generated Firestore rules are committed
        run: git diff --exit-code -- firestore.rules
